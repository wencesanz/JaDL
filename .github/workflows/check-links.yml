name: Check studio websites

on:
  # 1st of every month, 07:12 UTC
  schedule:
    - cron: '12 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Opens an issue "Webs a revisar · <mes>" with the sites that fail and
      # closes last month's one. GitHub emails it to the repo owner.
      - name: Check every website in studios.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-links.mjs
      - name: Keep the report as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.md
          if-no-files-found: ignore

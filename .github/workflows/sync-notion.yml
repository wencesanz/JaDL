name: Sync from Notion

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Send every sitemap URL to IndexNow (not only the changed ones)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Keep the current sitemap to compare with after the sync (IndexNow).
      - name: Save previous sitemap
        run: cp sitemap.xml "$RUNNER_TEMP/sitemap.old.xml"

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        # Also writes sitemap.xml, feed.xml, and refreshes the studio/country
        # count in index.html's og:description (see writeSitemap/writeFeed/
        # updateIndexDescription in sync-notion.mjs) — no separate step needed.
        run: node scripts/sync-notion.mjs

      - name: Prerender studio pages
        run: node scripts/prerender.mjs

      # Hubs + leaves for disciplines, countries, cities and regions.
      # Also merges their URLs into sitemap.xml.
      - name: Prerender collection pages
        run: node scripts/prerender-collections.mjs

      - name: Commit changes (if any)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A studios.json sitemap.xml feed.xml studio index.html disciplines.html countries.html cities.html regions.html discipline country city region
          if [[ -n "$(git status --porcelain studios.json sitemap.xml feed.xml studio index.html disciplines.html countries.html cities.html regions.html discipline country city region)" ]]; then
            git commit -m "chore: sync studios from Notion"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "✔ Changes pushed."
          else
            echo "✔ No changes."
          fi

      # Tell Bing & co. (IndexNow) which URLs changed, once Vercel has deployed them.
      - name: Notify IndexNow
        if: steps.commit.outputs.pushed == 'true' || inputs.indexnow_all
        continue-on-error: true
        run: |
          if [[ "${{ inputs.indexnow_all }}" == "true" ]]; then
            [[ "${{ steps.commit.outputs.pushed }}" == "true" ]] && sleep 120
            node scripts/indexnow.mjs --all sitemap.xml
          else
            sleep 120
            node scripts/indexnow.mjs "$RUNNER_TEMP/sitemap.old.xml" sitemap.xml
          fi
